<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Archive</title>
    <meta
      name="description"
      content="A home for archived Flash experiments, animations, and mini-games."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="brand-block">
          <p class="eyebrow">digital preservation</p>
          <h1>Flash Archive</h1>
        </div>
        <p class="subtitle">
          A personal collection of old Flash experiments, mini-games, and interactive
          web animations preserved in one place.
        </p>
      </header>

      <main>
        <section class="archive-panel">
          <div class="section-heading">
            <h2>Archive Library</h2>
            <span id="demo-count">0 demos</span>
          </div>
          <div id="demo-grid" class="demo-grid" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="assets/js/main.js"></script>
  </body>
</html>
